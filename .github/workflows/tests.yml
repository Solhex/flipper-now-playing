name: "Bridge: unit tests"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The bridge itself only needs bleak + pillow; the extension protocol test
      # uses the standard library, and websocket-client is imported lazily (the
      # Firefox debug-port fallback), so it is not required to run the suite.
      - name: Install dependencies
        run: python -m pip install --upgrade pip bleak pillow

      - name: Run the tests
        run: python -m unittest discover -s tests -v
